# SonarCloud (SonarQube Cloud) configuration
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# --- Project identity ---
sonar.organization=davidzambrano
sonar.projectKey=davidzambrano_playwright-playground
sonar.projectName=Playwright Playground
sonar.projectVersion=1.0.0

# --- Host ---
sonar.host.url=https://sonarcloud.io

# --- Sources ---
sonar.sources=pages,fixtures,utils,conftest.py
sonar.sourceEncoding=UTF-8

# --- Tests ---
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# --- Python version ---
sonar.python.version=3.11

# --- Exclusions ---
# Exclude frontend app, IDE configs, and generated artifacts
sonar.exclusions=**/.venv/**,**/__pycache__/**,auto-things/**,.windsurf/**,reports/**,logs/**,videos/**,traces/**,test-results/**,playwright-report/**

# --- Coverage ---
# Intentionally not collected: this is a UI test automation framework, so
# "coverage" from running the E2E suite over pages/fixtures/utils only shows
# which locators/actions were exercised by tests, not real code coverage.
# SonarCloud here is used for static analysis only (code smells, duplication,
# maintainability, bugs).
