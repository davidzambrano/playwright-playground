# This workflow runs code quality checks on every push
name: Code Quality
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: --require-hashes -r requirements.lock
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Run Pylint
        run: |
          pylint --fail-under=8.0 \
            --output-format=colorized \
            $(git ls-files '*.py' | grep -v '__pycache__' | grep -v '.venv' || echo "tests/ pages/ utils/ fixtures/ *.py")

  black:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Check code formatting with Black
        run: |
          black --check --diff --color .

  isort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install isort
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff --color .
