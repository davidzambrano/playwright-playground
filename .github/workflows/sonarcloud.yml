# Runs SonarCloud static analysis. Triggered manually via workflow_dispatch (disabled on push/PR).
# Requires SONAR_TOKEN to be set as a GitHub Actions secret.
#
# Note: this project is a UI test automation framework (Page Object Model over
# Playwright). "Code coverage" from running the E2E suite would only measure
# which locators/actions were exercised by tests, not real production code
# coverage, so it is intentionally not collected here. SonarCloud is used for
# static analysis (code smells, duplication, maintainability, bugs) only.
name: SonarCloud

on:
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
