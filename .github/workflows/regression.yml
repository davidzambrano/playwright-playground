# Runs Playwright automated tests against the Render-hosted application.
# Triggered manually via GitHub Actions UI with configurable environment, markers, and browser.
name: Regression

on:
  workflow_dispatch:
    inputs:
      test_environment:
        type: string
        description: 'Test environment URL'
        default: 'https://auto-things.onrender.com/'
        required: true
      test_markers:
        type: choice
        description: 'Test markers to run'
        options:
          - 'all'
          - 'smoke'
          - 'regression'
          - 'slow'
          - 'api'
          - 'ui'
          - 'pipelinedebug'
        default: 'all'
      browser:
        type: choice
        description: 'Browser to run tests against'
        options:
          - 'chromium'
          - 'firefox'
          - 'webkit'
        default: 'chromium'

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Wake up the Render app (free tier spins down after inactivity)
  # ---------------------------------------------------------------------------
  wake-app:
    name: Wake up Render app
    runs-on: ubuntu-latest
    steps:
      - name: Ping app until ready
        run: |
          echo "Waking up the app at ${{ inputs.test_environment }}"

          for i in {1..5}; do
            echo "Attempt $i: pinging..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.test_environment }}")
            echo "HTTP status: $STATUS"

            if [ "$STATUS" -eq 200 ]; then
              echo "App is ready!"
              exit 0
            fi

            echo "Not ready yet — waiting 30 seconds..."
            sleep 30
          done

          echo "ERROR: App failed to wake after 5 attempts. Aborting."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 2: Install dependencies and run Playwright tests in parallel shards
  # ---------------------------------------------------------------------------
  run-tests:
    needs: wake-app
    name: Run Playwright tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install ${{ inputs.browser }}
          playwright install-deps ${{ inputs.browser }}

      - name: Resolve pytest marker flag
        id: markers
        run: |
          if [ "${{ inputs.test_markers }}" == "all" ]; then
            echo "flags=" >> $GITHUB_OUTPUT
          else
            echo "flags=-m ${{ inputs.test_markers }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        env:
          BASE_URL: ${{ inputs.test_environment }}
        run: |
          mkdir -p reports/test-results-shard-${{ matrix.shard }} logs
          
          xvfb-run -a pytest \
            --browser ${{ inputs.browser }} \
            ${{ steps.markers.outputs.flags }} \
            --shard-id=${{ matrix.shard }} \
            --num-shards=4 \
            --reruns 2 \
            --html=reports/report-shard-${{ matrix.shard }}.html --self-contained-html

      - name: Upload test results (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            reports/test-results-shard-${{ matrix.shard }}/
            logs/
          retention-days: 7
